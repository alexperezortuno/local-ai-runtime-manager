server:
  host: "127.0.0.1"
  port: 8090

runtime:
  backend: "llamacpp"
  binary: "/path/to/llama-server"
  startup_timeout: "120s"
  shutdown_timeout: "15s"

scheduler:
  max_active_models: 3
  max_queue_size: 100
  lease_ttl: "10m"
  heartbeat_interval: "30s"
  max_lease_duration: "2h"

# Dry-run only: these margins never reject requests or change Scheduler state.
capacity:
  shadow_mode: true
  system_margin_percent: 10
  gpu_margin_percent: 10

proxy:
  queue_wait_timeout: "5m"
  inference_timeout: "10m"
  backend_connect_timeout: "5s"
  stream_idle_timeout: "2m"

recovery:
  journal_path: "./larm-recovery.json"
  durability: "sync"
  max_records: 10000

# Disabled by default. Enabling requires a private Unix socket directory,
# a private Ed25519 public-key ring, and an explicitly allowed UID.
admin:
  enabled: false
  socket_path: "/var/run/larm/admin.sock"
  public_key_path: "/var/lib/larm/admin-public-keys.json"
  allowed_uid: 1000
  audience: "larm-admin"
  capability_ttl: "5m"

models:
  code-fast:
    path: "/path/to/qwen-coder-14b.gguf"
    port: 18069
    context: 16384
    batch: 1024
    ubatch: 256
    gpu_layers: "all"
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"
    parallel: 1
    temperature: 0.20
    top_p: 0.85
    top_k: 40
    reasoning: "off"
    keep_alive: false
    # keep_alive/time_alive also request one automatic background preload at startup.
    time_alive: "10m"
    extra_args:
      - "--jinja"

  code-agent:
    path: "/path/to/qwen-coder-30b.gguf"
    port: 18070
    context: 32768
    batch: 1024
    ubatch: 256
    gpu_layers: "all"
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"
    parallel: 1
    temperature: 0.15
    top_p: 0.85
    top_k: 40
    reasoning: "off"
    # keep_alive has precedence and also requests automatic background preload.
     keep_alive: true
    time_alive: "0s" # keep_alive takes precedence
    extra_args:
      - "--jinja"
