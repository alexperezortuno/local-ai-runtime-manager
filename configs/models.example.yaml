server:
  # Local API bind address. Optional; defaults to 127.0.0.1 and must remain loopback.
  host: "127.0.0.1"
  # Local API port. Optional; defaults to 8090.
  port: 8090

  # Separate LAN API listener. Optional; defaults to disabled.
  # When enabled, host, port, Bearer auth, and a non-empty CIDR allowlist are required.
  lan:
    enabled: false
    # Required when LAN is enabled; must be a specific, non-loopback IP (not 0.0.0.0).
    host: "192.168.1.20"
    # Required when LAN is enabled; must not conflict with another listener/model.
    port: 8443
    auth:
      # Required when LAN is enabled; currently only "bearer" is supported.
      type: "bearer"
      # Required when LAN is enabled; names an environment variable containing API keys.
      # Never put API keys directly in this YAML file.
      api_keys_env: "LARM_LAN_API_KEYS"
    access:
      # Required when LAN is enabled; CIDRs allowed to connect to the LAN listener.
      allow:
        - "192.168.1.0/24"
    tls:
      # Optional. false starts HTTP and does not require certificate files.
      # true starts HTTPS and requires a valid certificate/key pair below.
      # If omitted, TLS stays enabled for compatibility with configs using cert/key.
      enabled: false
      # Required only when TLS is enabled (or enabled is omitted for legacy HTTPS).
      # Use absolute paths. Leave unset for HTTP.
      # cert_file: "/absolute/path/to/lan-cert.pem"
      # key_file: "/absolute/path/to/lan-key.pem"

runtime:
  backend: "llamacpp"
  binary: "/path/to/llama-server"
  startup_timeout: "120s"
  shutdown_timeout: "15s"

scheduler:
  max_active_models: 3
  max_queue_size: 100
  lease_ttl: "10m"
  heartbeat_interval: "30s"
  max_lease_duration: "2h"

# Dry-run only: these margins never reject requests or change Scheduler state.
capacity:
  shadow_mode: true
  system_margin_percent: 10
  gpu_margin_percent: 10
  # Capacity admission enforcement. Disabled by default: with enabled=false no
  # evaluator is installed, the Scheduler keeps its previous behavior and the
  # HTTP responses are unchanged. Enabling it installs the read-only capacity
  # evaluator on the Scheduler; it never starts a model by itself.
  admission:
    enabled: false
    on_insufficient: wait
    on_unknown: allow
    wait_timeout: "5m"
    reevaluation_interval: "2s"
    max_snapshot_age: "6s"

proxy:
  queue_wait_timeout: "5m"
  inference_timeout: "10m"
  backend_connect_timeout: "5s"
  stream_idle_timeout: "2m"

recovery:
  journal_path: "./larm-recovery.json"
  durability: "sync"
  max_records: 10000

# Disabled by default. Enabling requires a private Unix socket directory,
# a private Ed25519 public-key ring, and an explicitly allowed UID.
admin:
  enabled: false
  socket_path: "/var/run/larm/admin.sock"
  public_key_path: "/var/lib/larm/admin-public-keys.json"
  allowed_uid: 1000
  audience: "larm-admin"
  capability_ttl: "5m"

models:
  code-fast:
    path: "/path/to/qwen-coder-14b.gguf"
    host: "127.0.0.1"
    port: 18069
    context: 16384
    batch: 1024
    ubatch: 256
    gpu_layers: "all"
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"
    parallel: 1
    temperature: 0.20
    top_p: 0.85
    top_k: 40
    reasoning: "off"
    keep_alive: false
    # keep_alive/time_alive also request one automatic background preload at startup.
    time_alive: "10m"
    extra_args:
      - "--jinja"

  code-agent:
    path: "/path/to/qwen-coder-30b.gguf"
    host: "127.0.0.1"
    port: 18070
    context: 32768
    batch: 1024
    ubatch: 256
    gpu_layers: "all"
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"
    parallel: 1
    temperature: 0.15
    top_p: 0.85
    top_k: 40
    reasoning: "off"
    # keep_alive has precedence and also requests automatic background preload.
    keep_alive: true
    time_alive: "0s" # keep_alive takes precedence
    extra_args:
      - "--jinja"
